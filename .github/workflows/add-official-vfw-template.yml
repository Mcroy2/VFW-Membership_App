name: Add official VFW PDF template

on:
  push:
    paths:
      - '.github/workflows/add-official-vfw-template.yml'

permissions:
  contents: write

jobs:
  add-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official VFW membership application
        run: |
          curl -L --fail --retry 3 'https://www.vfw.org/-/media/vfwsite/files/my_vfw/training-and-support/membership/membership-application.pdf?la=en' -o membership-application.pdf
          test -s membership-application.pdf
      - name: Commit template
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add membership-application.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add official VFW membership application PDF template'
          git push
